[workspace]
resolver = "3"
members = [
    "core/wavey-geom",
    "core/wavey-materials",
    "core/wavey-speaker",
    "core/wavey-solver",
    "core/wavey-project",
    "core/wavey-ffi",
    "core/wavey-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wavey-geom = { path = "core/wavey-geom" }
wavey-materials = { path = "core/wavey-materials" }
wavey-speaker = { path = "core/wavey-speaker" }
wavey-solver = { path = "core/wavey-solver" }
wavey-project = { path = "core/wavey-project" }
uniffi = "0.32"
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
earcutr = "0.5"
rayon = "1.12"
thiserror = "2"
num-complex = { version = "0.4", features = ["serde", "bytemuck"] }
rustfft = "6.4"
clap = { version = "4.6", features = ["derive"] }
wgpu = "30"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
